[package]
name = "clipsync-desktop"
description = "ClipSyncRust desktop client: clipboard sync over an MQTT broker, end-to-end encrypted"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "clipsync-desktop"
path = "src/main.rs"

[dependencies]
clipsync-core = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
arboard = { workspace = true }
tray-icon = { workspace = true }
dirs = { workspace = true }
sys-locale = { workspace = true }
ureq = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
global-hotkey = { workspace = true }
xcap = { workspace = true }
ab_glyph = "0.2.32"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag = "2.1"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSScreen",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSPasteboard",
] }
objc2-av-foundation = { version = "0.3", features = [
    "AVAnimation",
    "AVPlayer",
    "AVPlayerItem",
    "AVPlayerLayer",
    "objc2-core-media",
    "objc2-quartz-core",
] }
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-quartz-core = "0.3"

# cargo wix 只从这里取两个 guid：upgrade-guid 固定下来，新包才会升级旧安装而不是
# 并存两份；path-guid 不固定就每次 init 换一个组件 GUID，旧条目留在注册表里没人清。
# 「程序和功能」的显示名得靠 `cargo wix init --product-name ClipSyncRust`，
# cargo-wix 不认 Cargo.toml 里的 product-name，写了也只是死数据。
[package.metadata.wix]
upgrade-guid = "6FE3AC0A-BB99-4AC7-B6C0-9AC20BCF01FA"
path-guid = "F2E1918B-3B64-4A1F-9A4A-5A7B0E538CFD"
