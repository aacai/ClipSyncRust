[package]
name = "clipsync-desktop"
description = "ClipSync desktop app: egui shell over clipsync-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "clipsync-desktop"
path = "src/main.rs"

[dependencies]
clipsync-core = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
arboard = { workspace = true }
tray-icon = { workspace = true }
dirs = { workspace = true }
sys-locale = { workspace = true }
ureq = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
global-hotkey = { workspace = true }
xcap = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSScreen", "NSWindow"] }

# cargo wix 读这里：产品名决定「程序和功能」里的条目，upgrade-guid 固定下来
# 新包才会升级旧安装而不是并存两份。
[package.metadata.wix]
product-name = "ClipSyncRust"
upgrade-guid = "6FE3AC0A-BB99-4AC7-B6C0-9AC20BCF01FA"
