[package]
name = "clipsync-desktop"
description = "ClipSyncRust desktop client: clipboard sync over an MQTT broker, end-to-end encrypted"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "clipsync-desktop"
path = "src/main.rs"

[dependencies]
clipsync-core = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
arboard = { workspace = true }
tray-icon = { workspace = true }
dirs = { workspace = true }
sys-locale = { workspace = true }
ureq = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
global-hotkey = { workspace = true }
xcap = { workspace = true }
ab_glyph = "0.2.32"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag = "2.1"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSScreen",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSPasteboard",
] }
objc2-av-foundation = { version = "0.3", features = [
    "AVAnimation",
    "AVPlayer",
    "AVPlayerItem",
    "AVPlayerLayer",
    "objc2-core-media",
    "objc2-quartz-core",
] }
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-quartz-core = "0.3"

# wxs 由仓库自己维护（wix/main.wxs），CI 不再 init，否则开始菜单项会被出厂模板抹掉。
# cargo-wix 从 Cargo.toml 只认这里的 guid：upgrade-guid 固定住，新包才会升级旧安装
# 而不是并存两份；product-name 它不认，写了也是死数据。
[package.metadata.wix]
upgrade-guid = "6FE3AC0A-BB99-4AC7-B6C0-9AC20BCF01FA"
