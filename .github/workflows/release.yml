name: Release

on:
  push:
    branches: [future]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            rust-target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            rust-target: ''
            args: ''
          - platform: windows-latest
            rust-target: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend deps
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev libclang-dev
      - name: Build bundle and publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/clipsync
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: ClipSync ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: 各平台的安装包见下方附件。
      - name: Build bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: apps/clipsync
        run: npm run tauri build -- ${{ matrix.args }}
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: clipsync-${{ matrix.platform }}-${{ matrix.rust-target }}
          path: |
            apps/clipsync/src-tauri/target/release/bundle
            apps/clipsync/src-tauri/target/aarch64-apple-darwin/release/bundle
            apps/clipsync/src-tauri/target/x86_64-apple-darwin/release/bundle
          if-no-files-found: warn
