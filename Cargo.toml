[workspace]
resolver = "2"
members = ["crates/clipsync-core", "crates/clipsync-desktop"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["zhiqiu"]

[workspace.dependencies]
clipsync-core = { path = "crates/clipsync-core" }
argon2 = "0.6.0"
aes-gcm = "0.11.1"
chacha20poly1305 = "0.11.0"
sha2 = "0.11.1"
base64 = "0.23.1"
hex = "0.4.3"
regex = "1.13.1"
zeroize = "1.8.2"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
futures = "0.3.34"
async-channel = "2.5.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
mqtt5 = { version = "0.48.2", default-features = false }
tracing = "0.1.44"
eframe = "0.37.0"
egui = "0.37.0"
arboard = "3.7.0"
tray-icon = "0.26.1"
dirs = "7.0.0"
